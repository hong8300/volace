name: CI

# Builds the debug APK and runs the JVM tests (Room migrations, matching, backup...) on every
# push and pull request. No device is needed; the shared debug key is not in the repo, so the
# build signs with the runner's own debug key.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already has an Android SDK (ANDROID_HOME) with licences accepted; add
      # the API 37 platform the app compiles against. (android-actions/setup-android@v3 fails
      # trying to install the long-gone "tools" package.)
      - name: Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug build
        run: ./gradlew assembleDebug

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
